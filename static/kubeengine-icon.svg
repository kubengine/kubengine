<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">KubeEngine icon</title>
  <desc id="desc">A connected hexagonal engine mark forming the letter K.</desc>
  <defs>
    <linearGradient id="frame" x1="80" y1="90" x2="430" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08266f"/>
      <stop offset="0.52" stop-color="#087cff"/>
      <stop offset="1" stop-color="#06205f"/>
    </linearGradient>
    <linearGradient id="core" x1="220" y1="90" x2="350" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08b9ed"/>
      <stop offset="0.48" stop-color="#087cff"/>
      <stop offset="1" stop-color="#073baf"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08c9ea"/>
      <stop offset="1" stop-color="#0785ef"/>
    </linearGradient>
    <linearGradient id="gold" x1="300" y1="220" x2="370" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#f5a400"/>
    </linearGradient>
  </defs>

  <!-- Connected infrastructure frame -->
  <path d="M256 52 432 153v206L256 460 80 359V153Z"
        fill="none" stroke="url(#frame)" stroke-width="42" stroke-linejoin="round"/>

  <!-- Golden engine impulse, tucked behind the K -->
  <path d="M294 256 374 207v98Z" fill="url(#gold)"/>

  <!-- Geometric K core -->
  <path d="M256 88v336M256 256l134-96M256 256l134 96"
        fill="none" stroke="url(#core)" stroke-width="54"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Three orchestration nodes -->
  <g stroke="#fff" stroke-width="13">
    <circle cx="256" cy="58" r="39" fill="url(#node)"/>
    <circle cx="72" cy="256" r="39" fill="url(#node)"/>
    <circle cx="256" cy="454" r="39" fill="url(#node)"/>
  </g>
</svg>
