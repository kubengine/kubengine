base_image: scratch
cmd: /bin/bash
user: root
setopts:
- ks10-adv-os.baseurl=http://172.31.54.1:8081/repository/update.cs2c.com.cn/NS/V10/V10SP3/os/adv/lic/base/x86_64/
- ks10-adv-updates.baseurl=http://172.31.54.1:8081/repository/update.cs2c.com.cn/NS/V10/V10SP3/os/adv/lic/updates/x86_64/
- ks10-adv-addons.baseurl=http://172.31.54.1:8081/repository/update.cs2c.com.cn/NS/V10/V10SP3/os/adv/lic/updates/x86_64/
author: duanzt
install_packages:
- bash
- coreutils
- procps-ng
- vim-minimal
- tzdata
- findutils
- grep
- ca-certificates
envs:
  HOME: /
  OS_ARCH: amd64
  OS_FLAVOUR: kylin-v10
  OS_NAME: linux
labels:
  org.opencontainers.image.vendor: kubengine.io

versions:
  alpine:
    labels:
      org.opencontainers.image.base.name: apps/kylin-v10:alpine
      org.opencontainers.image.description: Kylin v10 2403 Linux Base Image.
  openssl:
    install_packages:
    - openssl
    labels:
      org.opencontainers.image.base.name: apps/kylin-v10:openssl
      org.opencontainers.image.description: Kylin v10 2403 Linux Base Image(Contains openssl).
  build-env:
    install_packages:
    - cmake
    - automake
    - autoconf
    - libtool
    - pkgconfig
    - rpm-build
    - rpmdevtools
    - openssl-devel
    - zlib-devel
    - bzip2-devel
    - readline-devel
    - sqlite-devel
    - ncurses-devel
    - libffi-devel
    - libxml2-devel
    - libxslt-devel
    - git
    - wget
    - curl
    - iputils
    - vim
    - nano
    labels:
      org.opencontainers.image.base.name: apps/kylin-v10:build-env
      org.opencontainers.image.description: Build environment for Kylin V10 2403 Linux with development tools.
  cpp-build-env:
    install_packages:
    - cmake
    - automake
    - autoconf
    - libtool
    - pkgconfig
    - rpm-build
    - rpmdevtools
    - openssl-devel
    - zlib-devel
    - bzip2-devel
    - readline-devel
    - sqlite-devel
    - ncurses-devel
    - libffi-devel
    - libxml2-devel
    - libxslt-devel
    - git
    - wget
    - curl
    - iputils
    - vim
    - nano
    - gcc
    - gcc-c++
    - gcc-gfortran
    - llvm
    - llvm-devel
    - glibc-devel
    - glibc-static
    - libstdc++-devel
    - boost-devel
    - eigen3-devel
    - openblas-devel
    - lapack-devel
    - cmake3
    - make
    - ninja-build
    - meson
    labels:
      org.opencontainers.image.base.name: apps/kylin-v10:build-env
      org.opencontainers.image.description: C++ build environment for Kylin V10 2403 Linux with compiler and libraries.
