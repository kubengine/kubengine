# 仅为显式部署示例，不由应用自动应用。替换 namespace 后由集群管理员审查。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubengine-console
  namespace: kubengine-system
automountServiceAccountToken: false
---
# 通过每个获准命名空间的 RoleBinding 授予共享后端身份。
# Secret 和 pods/exec 必须按实际启用功能继续裁剪；平台用户授权另由应用强制执行。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubengine-console-resources
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, configmaps, secrets, persistentvolumeclaims, events]
    verbs: [get, list, create, update, patch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, create, update, patch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, create, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, create, update, patch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, create, update, patch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubengine-console-resources
  namespace: team-a
subjects:
  - kind: ServiceAccount
    name: kubengine-console
    namespace: kubengine-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubengine-console-resources
# 不含 Role/RoleBinding/Namespace/CRD、节点、Helm 和基础设施权限。
# 管理员按启用功能单独配置连接的权限上限，并审查 Pod Security、ServiceAccount
# 使用范围、Secret/PVC 挂载和网络策略；不要直接绑定 cluster-admin。
