# Release template only. Configure deployment-specific values after installation.
# No installation's credentials, certificates, node list, or state belongs here.
root_dir: /opt/kubengine
domain: example.invalid
security:
  uploads:
    image_bytes: 10737418240  # 单个镜像归档 10 GiB；Chart 固定为 2 MiB
    archive_bytes: 53687091200  # 镜像归档总额 50 GiB
    reserve_bytes: 1073741824  # 临时盘、归档盘至少预留 1 GiB
    concurrency: 2  # 同一安装所有 API 进程合计
    timeout_seconds: 3600
    retention_seconds: 604800  # 终态归档保留 7 天供重试
registry:
  username: ""
  password: ""
auth:
  jwt:
    algorithm: HS256
    token:
      expire_minutes: 30
      renew_threshold_minutes: 5
  users:
    admin:
      password_hash: ""
      ak: ""
      sk_hash: ""
tls:
  root_dir: /opt/kubengine/config/certs
  ca_password: ""
  ca_common_name: "Local deployment CA"
  ca_organization_name: "Local deployment"
  ca_email_address: ""
  ca_valid_days: 3650
  ca_key_length: 4096
kubernetes:
  master:
    ip: ""
    additional_ips: []
    control-plane-endpoint: ""
    interface: ""
    schedulable: false
  worker:
    ips: []
  cidr:
    service: 10.96.0.0/16
    pod: 10.97.0.0/16
  loadbalancer:
    ip-pools: []
  nameserver: []
cluster:
  nodes: []
  hostnames: {}
logger:
  level: INFO
  console: true
